<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel · Studio Parla</title>
<style>
  :root{
    --bg:#FAFAF8;--surface:#FFFFFF;--ink:#2A2724;--muted:#8B847A;
    --clay:#B5623C;--clay-soft:#F4E9E2;--line:#ECE7DF;
    --green:#4E7A5A;--green-soft:#E7F0E9;--amber:#B7822B;--amber-soft:#F6EDD9;
    --blue:#3B5C8A;--blue-soft:#E7EDF5;--radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}

  .sidebar{width:242px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
  .brand{padding:2px 8px 14px}
  .brand .logo{display:flex;align-items:center;gap:9px}
  .brand .mark{width:26px;height:26px;border-radius:7px;background:var(--clay);display:flex;align-items:center;justify-content:center}
  .brand .mark svg{width:15px;height:15px}
  .brand h1{font-size:15px;margin:0;letter-spacing:-.2px;font-weight:650}
  .brand span{font-size:11px;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}

  .ws-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:650;padding:0 8px 6px}
  .ws-seg{display:flex;background:#F3EFE8;border-radius:10px;padding:3px;gap:2px;margin:0 4px}
  .ws-seg button{all:unset;flex:1;text-align:center;cursor:pointer;font-size:11.5px;font-weight:600;padding:7px 2px;border-radius:8px;color:var(--muted);transition:.12s}
  .ws-seg button.active{background:#fff;color:var(--clay);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .ws-hint{font-size:11px;color:var(--muted);padding:8px 8px 4px}

  .nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--muted);font-weight:550;font-size:13.5px;transition:.12s}
  .nav button svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
  .nav button:hover{background:#F5F1EA;color:var(--ink)}
  .nav button.active{background:var(--clay-soft);color:var(--clay)}
  .side-foot{margin-top:auto;padding:12px 8px 2px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:22px 30px 16px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
  .topbar h2{margin:0;font-size:20px;letter-spacing:-.3px;font-weight:650}
  .topbar .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  .topbar .today{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .content{padding:24px 30px 70px;max-width:1080px}

  h3.blk{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:26px 0 12px;font-weight:650}
  h3.blk:first-child{margin-top:2px}
  .lead{color:#4a453e;font-size:14px;max-width:64ch;margin:0 0 4px}
  .muted{color:var(--muted)}
  .row-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 12px}

  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
  .two{grid-template-columns:1fr 1fr}
  @media(max-width:820px){.two{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .kpi .n{font-size:26px;font-weight:680;letter-spacing:-.5px}
  .kpi .l{font-size:12.5px;color:var(--muted);margin-top:2px}
  .kpi .n .u{font-size:14px;color:var(--muted);font-weight:600;margin-left:3px}
  .daycard{transition:border-color .12s,box-shadow .12s}
  .daycard:hover{border-color:var(--clay);box-shadow:0 2px 10px rgba(181,98,60,.08)}

  .alert{display:flex;gap:11px;padding:12px 14px;border-radius:10px;align-items:flex-start;margin-bottom:9px;border:1px solid var(--line);background:var(--surface)}
  .alert .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--amber)}
  .alert.crit .dot{background:var(--clay)}
  .alert .txt{font-size:13.5px}
  .alert .txt b{font-weight:620}
  .alert .txt small{display:block;color:var(--muted);font-size:12px;margin-top:1px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:650;padding:8px 12px;border-bottom:1px solid var(--line)}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#FBF8F3}
  .tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .name{font-weight:600}

  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
  .tag.g{background:var(--green-soft);color:var(--green)}
  .tag.c{background:var(--clay-soft);color:var(--clay)}
  .tag.a{background:var(--amber-soft);color:var(--amber)}
  .tag.b{background:var(--blue-soft);color:var(--blue)}
  .tag.n{background:#F0EDE8;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:4px}

  .btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:var(--clay);color:#fff;padding:9px 15px;border-radius:9px;font-weight:600;font-size:13px;transition:filter .12s}
  .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.sm{padding:6px 11px;font-size:12px}
  .btn svg{width:14px;height:14px}

  label.f{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 5px}
  .i{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
  .i:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px var(--clay-soft)}
  textarea.i{resize:vertical;min-height:64px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .calc{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.calc{grid-template-columns:1fr}}
  .result{background:#FBF7F3;border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .line{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}
  .line.tot{border-bottom:none;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-weight:700;font-size:16px}
  .line .k{color:var(--muted)}
  textarea.msgbox{width:100%;min-height:150px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:13.5px;line-height:1.55;background:#fff;resize:vertical;white-space:pre-wrap}

  .msgcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px}
  .msgcard .h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
  .msgcard .body{font-size:13.5px;color:#4a453e;white-space:pre-wrap;line-height:1.55;background:#FBF8F3;border-left:3px solid var(--clay);border-radius:6px;padding:10px 12px}

  .list{list-style:none;padding:0;margin:0}
  .list li{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
  .list li:last-child{border-bottom:none}
  .chk{width:16px;height:16px;border-radius:5px;border:2px solid var(--line);flex-shrink:0;margin-top:2px}
  .chk.on{background:var(--green);border-color:var(--green);position:relative}
  .chk.on::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .pill{font-size:11.5px;background:#F3EFE8;border-radius:6px;padding:2px 7px;color:var(--muted);font-weight:600}

  .cal{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
  .cal-head b{font-size:15px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .dow{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px;text-align:center;font-weight:600;border-bottom:1px solid var(--line)}
  .cal-cell{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px}
  .cal-cell:nth-child(7n){border-right:none}
  .cal-cell.out{background:#FBF9F5}
  .cal-cell .d{font-weight:600;font-size:12px;margin-bottom:4px;color:var(--muted)}
  .cal-cell.today .d{background:var(--clay);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}
  .ev{font-size:10.5px;padding:2px 5px;border-radius:5px;margin-bottom:3px;background:var(--clay-soft);color:var(--clay);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev.w{background:var(--blue-soft);color:var(--blue)} .ev.k{background:var(--amber-soft);color:var(--amber)} .ev.a{background:var(--green-soft);color:var(--green)}

  .overlay{position:fixed;inset:0;background:rgba(30,26,22,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;opacity:0;pointer-events:none;transition:.15s}
  .overlay.show{opacity:1;pointer-events:auto}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:460px;max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
  .modal h4{margin:0 0 4px;font-size:16px}
  .modal .mactions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.22s;pointer-events:none;z-index:70}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:720px){
    .app{flex-direction:column}
    .sidebar{width:auto;height:auto;position:static;padding:12px}
    .side-foot{display:none}
    .topbar{padding:16px 18px 12px}.content{padding:18px}
    .cal-cell{min-height:70px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M8 21h8M12 21v-4M7 3h10l-1 7a4 4 0 01-8 0L7 3z"/></svg></div>
      <div><h1>Studio Parla</h1><span>Painel interno</span></div>
    </div></div>
    <div class="ws-lbl">Workspace</div>
    <div class="ws-seg" id="wsSeg"></div>
    <div class="ws-hint" id="wsHint"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Protótipo local · nada é salvo (recarregar zera as edições)</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div><h2 id="ttl">—</h2><div class="sub" id="sub"></div></div>
      <div class="today">Sábado, 11 jul 2026 · Vitória/ES</div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="toast" id="toast">Copiado!</div>

<script>
/* ---------------- DADOS (em memória, sem persistência) ---------------- */
let _id=100; const uid=()=>++_id;
const db={
  turmas:[
    {id:1,nome:"Quarta · 15h–18h",dia:3,hora:"15:00"},
    {id:2,nome:"Quarta · 18h–21h",dia:3,hora:"18:00"},
    {id:3,nome:"Quinta · 18h–21h",dia:4,hora:"18:00"},
  ],
  contatos:[
    {id:11,nome:"Mariana",tel:"27 99243-8823",origem:"Instagram",obs:"Namorado Thiago faz junto."},
    {id:12,nome:"Isadora",tel:"27 99622-0201",origem:"Instagram",obs:"Definir horário (qua ou qui noite)."},
    {id:13,nome:"Fabiana",tel:"27 99799-3964",origem:"Instagram",obs:"Migrando p/ qua+qui noite."},
    {id:14,nome:"Lívia Araújo",tel:"27 99911-7997",origem:"Instagram",obs:"Fez modelagem + pintura."},
    {id:15,nome:"Sandra",tel:"27 98825-3590",origem:"Instagram",obs:""},
    {id:16,nome:"Igor Junior",tel:"27 99283-6002",origem:"Indicação",obs:""},
    {id:17,nome:"Catarina Botelho",tel:"27 99960-1910",origem:"Indicação",obs:"Terapia do Barro."},
    {id:18,nome:"Ana Carolina",tel:"27 99725-2712",origem:"Instagram",obs:"Aluna de junho, não retoma agora."},
    {id:19,nome:"Thiago",tel:"—",origem:"Indicação",obs:"Namorado da Mariana."},
    {id:20,nome:"Glauciene",tel:"—",origem:"Instagram",obs:""},
    {id:21,nome:"Milena",tel:"27 99799-3642",origem:"Workshop",obs:""},
    {id:22,nome:"Wânia",tel:"27 99778-4004",origem:"Workshop",obs:""},
    {id:23,nome:"Aluna nova",tel:"—",origem:"Instagram",obs:"Fechou 10/07."},
  ],
  matriculas:[
    {id:1,pessoaId:11,turmaId:3,mensalidade:520,pagamento:"Cartão",status:"Ativa"},
    {id:2,pessoaId:19,turmaId:3,mensalidade:520,pagamento:"—",status:"Ativa"},
    {id:3,pessoaId:12,turmaId:3,mensalidade:500,pagamento:"PIX",status:"Ativa"},
    {id:4,pessoaId:13,turmaId:2,mensalidade:520,pagamento:"—",status:"Ativa"},
    {id:5,pessoaId:14,turmaId:1,mensalidade:520,pagamento:"—",status:"Ativa"},
    {id:6,pessoaId:15,turmaId:1,mensalidade:520,pagamento:"—",status:"Ativa"},
    {id:7,pessoaId:23,turmaId:1,mensalidade:520,pagamento:"A definir",status:"Nova"},
  ],
  workshops:[
    {id:1,nome:"Colônia de férias (infantil)",datas:"16, 23 e 30/07 · 14h–17h30",preco:"220 / 210 / 200 por dia"},
    {id:2,nome:"Workshop de sábado",datas:"12/07",preco:"a definir"},
    {id:3,nome:"Workshop 08/07 (realizado)",datas:"08/07",preco:"—"},
  ],
  inscricoes:[
    {id:1,pessoaId:21,workshopId:3,status:"Realizada"},
    {id:2,pessoaId:22,workshopId:3,status:"Realizada"},
  ],
  avulsas:[
    {id:1,pessoaId:20,data:"2026-07-15",turmaId:1,status:"Confirmada"},
  ],
  pecas:[
    {id:1,pessoaId:18,descricao:"Peças do mês de junho",dataDeixou:"2026-06-20",estimativa:"—",status:"pronta"},
    {id:2,pessoaId:12,descricao:"Canequinha",dataDeixou:"2026-07-09",estimativa:"~15 dias",status:"producao"},
  ],
  relatorios:[
    {id:1,data:"2026-07-09",turmaId:3,autor:"Catarina",resumo:"Aula à noite. Lívia fez modelagem e pintura em aulas separadas. Isadora deixou uma canequinha para queima."},
  ],
};

const origens=["Instagram","Indicação","Google","Passou na frente","Workshop","Outro"];
const pagamentos=["PIX","Cartão","Débito","A definir","—"];
const statusMat=["Ativa","Pausada","Nova","Saiu"];
const pecaStatus={producao:["Em produção","a"],pronta:["Pronta · avisar","c"],avisado:["Aguardando retirada","b"],entregue:["Entregue","g"]};
const pecaNext={producao:["pronta","Marcar pronta"],pronta:["avisado","Marcar avisada"],avisado:["entregue","Marcar entregue"]};

/* ---------------- HELPERS ---------------- */
const byId=(a,id)=>a.find(x=>x.id==id);
const pessoa=id=>byId(db.contatos,id)||{nome:"?"};
const turma=id=>byId(db.turmas,id)||{nome:"—"};
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const fmt=n=>"R$ "+Number(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtKg=n=>Number(n).toLocaleString("pt-BR",{minimumFractionDigits:3,maximumFractionDigits:3});
const dataBR=iso=>{if(!iso||iso==="—")return "—";const p=iso.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso;};
function opts(arr){return arr.map(o=>({value:o,label:o}));}
function contatoOpts(){return db.contatos.map(c=>({value:c.id,label:c.nome}));}
function turmaOpts(){return db.turmas.map(t=>({value:t.id,label:t.nome}));}
function pessoasComVinculo(pid){
  const v=[];
  db.matriculas.filter(m=>m.pessoaId==pid).forEach(m=>v.push('<span class="tag c">'+esc(turma(m.turmaId).nome.split(" ·")[0])+'</span>'));
  db.avulsas.filter(a=>a.pessoaId==pid).forEach(()=>v.push('<span class="tag g">Avulsa</span>'));
  db.inscricoes.filter(i=>i.pessoaId==pid).forEach(()=>v.push('<span class="tag b">Workshop</span>'));
  return v.length?'<div class="chips">'+v.join("")+'</div>':'<span class="muted">—</span>';
}

/* ---------------- MODAL / FORM ---------------- */
let _onSave=null;
function showModal(title,bodyHTML,onSave){
  _onSave=onSave;
  document.getElementById("overlay").innerHTML=
    '<div class="modal"><h4>'+esc(title)+'</h4><div>'+bodyHTML+'</div>'+
    '<div class="mactions"><button class="btn ghost" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn" onclick="saveModal()">Salvar</button></div></div>';
  document.getElementById("overlay").classList.add("show");
}
function closeModal(){document.getElementById("overlay").classList.remove("show");_onSave=null;}
function saveModal(){if(_onSave)_onSave();}
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal();});

function openForm(title,fields,onSubmit){
  const body=fields.map(f=>{
    const id="f_"+f.key;
    if(f.type==="select"){
      const ph=f.placeholder?'<option value="">'+esc(f.placeholder)+'</option>':"";
      const os=f.options.map(o=>'<option value="'+esc(o.value)+'" '+(String(o.value)===String(f.value)?"selected":"")+'>'+esc(o.label)+'</option>').join("");
      return '<label class="f">'+esc(f.label)+'</label><select class="i" id="'+id+'">'+ph+os+'</select>';
    }
    if(f.type==="textarea") return '<label class="f">'+esc(f.label)+'</label><textarea class="i" id="'+id+'">'+esc(f.value)+'</textarea>';
    return '<label class="f">'+esc(f.label)+'</label><input class="i" id="'+id+'" type="'+(f.type||"text")+'" '+(f.step?'step="'+f.step+'"':"")+' value="'+esc(f.value)+'">';
  }).join("");
  showModal(title,body,()=>{
    const out={};
    fields.forEach(f=>out[f.key]=document.getElementById("f_"+f.key).value);
    onSubmit(out); closeModal(); render(); toast("Salvo");
  });
}

/* ---------------- CRUD ---------------- */
function contatoForm(id){
  const c=id?byId(db.contatos,id):{};
  openForm(id?"Editar contato":"Novo contato",[
    {key:"nome",label:"Nome",value:c.nome},
    {key:"tel",label:"WhatsApp",value:c.tel},
    {key:"origem",label:"Origem",type:"select",options:opts(origens),value:c.origem||"Instagram"},
    {key:"obs",label:"Observações",type:"textarea",value:c.obs},
  ],v=>{ if(id)Object.assign(c,v); else db.contatos.push({id:uid(),...v}); });
}
function matriculaForm(id){
  const m=id?byId(db.matriculas,id):{};
  openForm(id?"Editar matrícula":"Nova matrícula",[
    {key:"pessoaId",label:"Aluno",type:"select",options:contatoOpts(),value:m.pessoaId,placeholder:"Selecione…"},
    {key:"turmaId",label:"Turma",type:"select",options:turmaOpts(),value:m.turmaId,placeholder:"Selecione…"},
    {key:"mensalidade",label:"Mensalidade (R$)",type:"number",value:m.mensalidade!=null?m.mensalidade:520},
    {key:"pagamento",label:"Forma de pagamento",type:"select",options:opts(pagamentos),value:m.pagamento||"—"},
    {key:"status",label:"Situação",type:"select",options:opts(statusMat),value:m.status||"Ativa"},
  ],v=>{
    const rec={pessoaId:+v.pessoaId,turmaId:+v.turmaId,mensalidade:+v.mensalidade,pagamento:v.pagamento,status:v.status};
    if(id)Object.assign(m,rec); else db.matriculas.push({id:uid(),...rec});
  });
}
function avulsaForm(id){
  const a=id?byId(db.avulsas,id):{};
  openForm(id?"Editar avulsa":"Nova aula avulsa",[
    {key:"pessoaId",label:"Aluno",type:"select",options:contatoOpts(),value:a.pessoaId,placeholder:"Selecione…"},
    {key:"data",label:"Data",type:"date",value:a.data},

function relLista(){
  const rs=[...db.relatorios].sort((a,b)=>b.data.localeCompare(a.data));

      return '<div class="card daycard" style="margin-bottom:10px;cursor:pointer" onclick="openDia('+r.id+')">'+

function relDetalhe(id){
  const r=byId(db.relatorios,id);

  const deixadas=db.pecas.filter(p=>p.dataDeixou===r.data);
  const prontasHoje=db.pecas.filter(p=>p.dataPronta===r.data);
  const emProducao=db.pecas.filter(p=>p.status==="producao");
  const badge=p=>{const st=pecaStatus[p.status]||["?","n"];return '<span class="tag '+st[1]+'">'+st[0]+'</span>';};
  return ''+
    '<button class="btn ghost sm" onclick="voltarDias()">‹ Voltar aos dias</button>'+
    '<div class="row-head" style="margin-top:14px"><div><h3 class="blk" style="margin:0">'+dataBR(r.data)+' · '+(r.turmaId?esc(turma(r.turmaId).nome):"Geral")+'</h3><span class="muted" style="font-size:12px">por '+esc(r.autor)+'</span></div><button class="btn ghost sm" onclick="relatorioForm('+r.id+')">Editar dia</button></div>'+
    '<div class="card"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:650;color:var(--muted);margin-bottom:6px">Resumo do dia</div>'+(esc(r.resumo)||'<span class="muted">Sem resumo.</span>')+'</div>'+
    '<div class="row-head" style="margin-top:22px"><h3 class="blk" style="margin:0">Peças deixadas neste dia</h3><button class="btn sm" onclick="pecaNoDia('+r.id+')">+ Registrar peça</button></div>'+
    '<div class="tbl-wrap"><table><thead><tr><th>Aluno</th><th>Peça</th><th>Estimativa</th><th>Status</th><th></th></tr></thead><tbody>'+
      (deixadas.map(p=>'<tr><td class="name">'+esc(pessoa(p.pessoaId).nome)+'</td><td>'+esc(p.descricao)+'</td><td>'+esc(p.estimativa)+'</td><td>'+badge(p)+'</td><td style="text-align:right"><button class="btn ghost sm" onclick="pecaForm('+p.id+')">Editar</button></td></tr>').join("")||'<tr><td colspan="5" class="muted">Nenhuma peça registrada neste dia.</td></tr>')+
    '</tbody></table></div>'+
    '<h3 class="blk">Marcar peças como prontas hoje</h3>'+
    '<div class="tbl-wrap"><table><thead><tr><th>Aluno</th><th>Peça</th><th>Deixou</th><th></th></tr></thead><tbody>'+
      (emProducao.map(p=>'<tr><td class="name">'+esc(pessoa(p.pessoaId).nome)+'</td><td>'+esc(p.descricao)+'</td><td>'+dataBR(p.dataDeixou)+'</td><td style="text-align:right"><button class="btn sm" onclick="marcarProntaNoDia('+p.id+','+r.id+')">Ficou pronta hoje</button></td></tr>').join("")||'<tr><td colspan="4" class="muted">Nenhuma peça em produção.</td></tr>')+
    '</tbody></table></div>'+
    '<h3 class="blk">Peças que ficaram prontas neste dia</h3>'+
    '<div class="tbl-wrap"><table><thead><tr><th>Aluno</th><th>Peça</th><th>Status</th></tr></thead><tbody>'+
      (prontasHoje.map(p=>'<tr><td class="name">'+esc(pessoa(p.pessoaId).nome)+'</td><td>'+esc(p.descricao)+'</td><td>'+badge(p)+'</td></tr>').join("")||'<tr><td colspan="3" class="muted">Nenhuma peça marcada como pronta neste dia.</td></tr>')+
    '</tbody></table></div>';
}

/* ---------------- CALENDÁRIO ---------------- */
let calY=2026,calM=6;
const eventosData={
  "2026-07-12":[["Workshop de sábado","w"]],
  "2026-07-15":[["Avulsa · Glauciene 15h","a"]],
  "2026-07-16":[["Colônia infantil 14h","k"]],
  "2026-07-22":[["Reposição Mariana+Thiago 15h","a"]],
  "2026-07-23":[["Colônia infantil 14h","k"]],
  "2026-07-30":[["Colônia infantil 14h","k"]],
};
function changeMonth(d){calM+=d;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}render();}
function calendarHTML(){
  const meses=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const first=new Date(calY,calM,1).getDay();
  const dim=new Date(calY,calM+1,0).getDate();
  const dowN=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  let cells="";
  for(let i=0;i<first;i++)cells+='<div class="cal-cell out"></div>';
  for(let d=1;d<=dim;d++){
    const wd=new Date(calY,calM,d).getDay();
    const iso=calY+"-"+String(calM+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const isToday=(calY===2026&&calM===6&&d===11);
    let evs=[];
    if(wd===3){evs.push(["Aulas · 15h e 18h",""]);}
    if(wd===4){evs.push(["Aula · 18h",""]);}
    (eventosData[iso]||[]).forEach(e=>evs.push(e));
    cells+='<div class="cal-cell '+(isToday?"today":"")+'"><div class="d">'+d+'</div>'+evs.map(e=>'<div class="ev '+e[1]+'">'+e[0]+'</div>').join("")+'</div>';
  }
  return ''+
    '<p class="lead">Turmas semanais (quartas e quintas), workshops, avulsas e a colônia — tudo num mês só.</p>'+
    '<div class="cal" style="margin-top:12px"><div class="cal-head">'+
      '<button class="btn ghost sm" onclick="changeMonth(-1)">‹</button><b>'+meses[calM]+' '+calY+'</b>'+
      '<button class="btn ghost sm" onclick="changeMonth(1)">›</button></div>'+
      '<div class="cal-grid">'+dowN.map(d=>'<div class="dow">'+d+'</div>').join("")+cells+'</div></div>'+
    '<div style="margin-top:12px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px" class="muted">'+
      '<span><span class="ev" style="display:inline-block">Aulas</span> turma regular</span>'+
      '<span><span class="ev w" style="display:inline-block">Workshop</span></span>'+
      '<span><span class="ev k" style="display:inline-block">Colônia</span></span>'+
      '<span><span class="ev a" style="display:inline-block">Avulsa / reposição</span></span></div>';
}

/* ---------------- CALCULADORA ---------------- */
function calc(){
  const g=id=>document.getElementById(id);
  if(!g("c-mens"))return;
  const mens=parseFloat(g("c-mens").value)||0,peso=parseFloat(g("c-peso").value)||0,pesoE=parseFloat(g("c-esm").value)||0;
  const rA=parseFloat(g("r-arg").value)||0,rB=parseFloat(g("r-bis").value)||0,rE=parseFloat(g("r-esm").value)||0;
  const nome=g("c-nome").value.trim()||"aluno(a)";
  const argila=peso*rA,bis=peso*rB,esm=pesoE*rE,tot=mens+argila+bis+esm;
  g("o-mens").textContent=fmt(mens);g("o-arg").textContent=fmt(argila);g("o-bis").textContent=fmt(bis);
  g("o-esm").textContent=fmt(esm);g("o-esm-line").style.display=esm>0?"flex":"none";g("o-tot").textContent=fmt(tot);
  let m="Total geral da "+nome+":\n• Peso total: "+fmtKg(peso)+" kg\n";
  if(mens>0)m+="• Mensalidade: "+fmt(mens)+"\n";
  m+="• Argila: "+fmt(argila)+"\n• Queima de biscoito: "+fmt(bis)+"\n";
  if(esm>0)m+="• Queima de esmalte: "+fmt(esm)+"\n";
  m+="• Valor total: "+fmt(tot);
  g("c-msg").value=m;
}
function preset(w){const g=id=>document.getElementById(id);
  if(w==="mariana"){g("c-nome").value="Mariana";g("c-mens").value=520;g("c-peso").value=0.792;g("c-esm").value=0;}
  else{g("c-nome").value="Isadora";g("c-mens").value=500;g("c-peso").value=0.296;g("c-esm").value=0;}
  calc();}

/* ---------------- COPY / TOAST ---------------- */
function doCopy(t){const ok=()=>toast("Copiado!");if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok).catch(()=>fb(t,ok));}else fb(t,ok);}
function fb(t,cb){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(a);cb&&cb();}
function copiar(id){doCopy(document.getElementById(id).value);}
function copiarMsg(i){doCopy(MSGS[i].b);}
let _tt;function toast(m){const t=document.getElementById("toast");t.textContent=m||"Feito";t.classList.add("show");clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove("show"),1500);}

/* ---------------- WORKSPACES / RENDER ---------------- */
const WORKSPACES={
  operacao:{label:"Operação",hint:"Uso diário do ateliê",views:["relatorios","pecas","agenda","atendimento","fechamento"]},
  cadastros:{label:"Cadastros",hint:"Pessoas, turmas e serviços",views:["contatos","matriculas","turmas","workshops","precos"]},
  tatica:{label:"Tática",hint:"Visão geral e estratégia",views:["visaogeral"]},
};
const state={ws:"operacao",view:"relatorios",relSel:null};

function renderSidebar(){
  document.getElementById("wsSeg").innerHTML=Object.keys(WORKSPACES).map(k=>
    '<button class="'+(state.ws===k?"active":"")+'" onclick="setWorkspace(\''+k+'\')">'+WORKSPACES[k].label+'</button>').join("");
  document.getElementById("wsHint").textContent=WORKSPACES[state.ws].hint;
  document.getElementById("nav").innerHTML=WORKSPACES[state.ws].views.map(v=>{
    const V=VIEWS[v];
    return '<button class="'+(state.view===v?"active":"")+'" onclick="setView(\''+v+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+V.icon+'</svg>'+V.title+'</button>';
  }).join("");
}
function setWorkspace(ws){state.ws=ws;state.view=WORKSPACES[ws].views[0];state.relSel=null;render();}
function setView(v){state.view=v;state.relSel=null;render();}
function render(){
  renderSidebar();
  const V=VIEWS[state.view];
  document.getElementById("ttl").textContent=V.title;
  document.getElementById("sub").textContent=V.sub;
  document.getElementById("content").innerHTML=V.render();
  if(V.after)V.after();
  window.scrollTo(0,0);
}
render();
</script>
